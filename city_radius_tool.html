<style>
/* src/style.css */
/* style.css - 界面样式，从单文件版原样抽出，无改动 */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#1f2937;background:#f5f7fa}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative;z-index:20}
.brand{font-size:16px;font-weight:600;white-space:nowrap;letter-spacing:.3px}
.brand span{color:#2563eb}
.ctrl{display:flex;align-items:center;gap:7px;font-size:13px;color:#4b5563;white-space:nowrap}
.citywrap{position:relative}
input[type=text]{width:170px;padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:13px;outline:none}
input[type=text]:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12)}
#suggest{position:absolute;top:36px;left:0;width:250px;max-height:260px;overflow:auto;background:#fff;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none;z-index:50}
#suggest div{padding:8px 11px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#suggest div:hover{background:#eff6ff}
#suggest small{color:#9ca3af}
input[type=range]{width:150px;accent-color:#2563eb}
.rval{display:inline-block;min-width:58px;font-weight:600;color:#2563eb;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;font-size:12px;padding:6px 10px;border:1px solid #d1d5db;background:#fff;border-radius:6px;color:#374151}
button:hover{border-color:#2563eb;color:#2563eb}
button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.quick{display:flex;gap:4px}
.quick button{padding:5px 8px}
.seg{display:flex;border:1px solid #d1d5db;border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 11px}
label.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:#4b5563;cursor:pointer}
.main{display:flex;height:calc(100vh - 62px);min-height:420px}
.side{width:330px;flex:0 0 330px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden}
.shead{padding:13px 15px 11px;border-bottom:1px solid #eef0f3;background:#fafbfc}
.shead h2{margin:0 0 8px;font-size:14px;font-weight:600}
.stats{font-size:12px;color:#6b7280;line-height:1.7}
.stats b{color:#111827;font-size:15px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:10px;padding:1px 8px;margin:2px 3px 0 0;font-size:11px}
#list{flex:1;overflow:auto;padding:6px 0}
.row{display:flex;align-items:center;gap:9px;padding:9px 15px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-size:13px}
.row:hover{background:#f0f7ff}
.idx{width:22px;color:#9ca3af;font-size:11px;text-align:right;flex:0 0 22px;font-variant-numeric:tabular-nums}
.nm{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;flex:0 0 auto}
.tag.c{background:#fff1e8;color:#c2410c}
.tag.d{background:#eef2ff;color:#4338ca}
.dst{color:#2563eb;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 62px;text-align:right}
.sub{color:#9ca3af;font-size:11px;flex:0 0 52px;text-align:right}
.sfoot{padding:9px 15px;border-top:1px solid #eef0f3;font-size:11px;color:#9ca3af;line-height:1.6;background:#fafbfc}
.sfoot b{color:#6b7280}
#map{flex:1;height:100%;min-width:0;position:relative;overflow:hidden;background:#eef2f7}
#card{position:absolute;right:18px;top:78px;width:210px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:13px 15px;display:none;z-index:1200;font-size:13px}
#card h3{margin:0 0 7px;font-size:15px}
#card p{margin:4px 0;color:#6b7280}
#card b{color:#2563eb}
#card .x{position:absolute;right:8px;top:6px;cursor:pointer;color:#9ca3af;font-size:16px;line-height:1}
.note{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(255,255,255,.94);border:1px solid #e5e7eb;border-radius:8px;padding:7px 13px;font-size:11px;color:#6b7280;box-shadow:0 2px 10px rgba(0,0,0,.07);z-index:1100;white-space:nowrap}

<script>
/* src/app.js */
/*
 * app.js - 城市半径圈选工具 · 业务逻辑
 * 依赖：config.js（APP_CONFIG）、city_data.js（CITY_DATA）、leaflet.js（L）
 * 无构建步骤、无框架；数据/计算/导出全本地，底图为可选增强
 *
 * 底图有两种模式：
 *   1) 在线：Leaflet + 瓦片底图（高德 / 卫星 / OSM / 天地图，见 config.js）
 *   2) 离线：内置 SVG 等距投影示意图（无网络、无 Key 也能看到圈和点）
 */
let map = null, tileLayers = [], circleLayer = null, markerLayer = null, labelLayer = null;
let mapHost = null;            /* Leaflet 的容器（#map 的子元素） */
let needsFit = true;           /* 下一次渲染是否需要重置视野 */
let providerId = 'amap';       /* 当前底图 id，见 config.js */
let centerCity = null;
let radiusKm = 100, onlyCity = false, hideOwn = true;
let results = [];

/* ================= 通用工具 ================= */
var CFG = window.APP_CONFIG || {};
providerId = CFG.defaultProvider || 'amap';
radiusKm = CFG.defaultRadius || 100;

function findCity(name){
  if (!name) return null;
  var n = String(name).trim();
  return CITY_DATA.find(function(r){ return r.n === n; })
      || CITY_DATA.find(function(r){ return r.n === n + '市'; })
      || CITY_DATA.find(function(r){ return r.n === n + '区'; })
      || CITY_DATA.find(function(r){ return r.n === n + '县'; })
      || CITY_DATA.find(function(r){ return r.l === 'c' && r.n.indexOf(n) === 0; })
      || null;
}
centerCity = findCity(CFG.defaultCity || '广州市') || CITY_DATA[0];

function hav(lng1, lat1, lng2, lat2){
  var R = 6371.0088;
  var p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180;
  var dp = p2-p1, dl = (lng2-lng1)*Math.PI/180;
  var a = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.sqrt(a));
}
function coreName(n){ return n.replace(/(市|区|县|旗|盟)$/,''); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function currentProvider(){
  var list = CFG.providers || {};
  return list[providerId] || list[CFG.defaultProvider] || null;
}

/* WGS-84 → GCJ-02（国内底图纠偏）：数据显示坐标随底图坐标系自动换算 */

  r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3;
  r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
  return r;

function gcjTlng(x, y){
  var r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
  r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3;
  r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;

/* 数据经纬度 → 当前底图上的显示坐标 */
function toLatLng(lng, lat){
  var p = currentProvider();
  if (p && p.crs === 'gcj02'){
    var g = wgs2gcj(lng, lat);
    return L.latLng(g[1], g[0]);
  }
  return L.latLng(lat, lng);

/* 1. 圈选计算：Haversine 球面直线距离，按距离升序返回结果 */
function compute(){
  var core = coreName(centerCity.n);
  var arr = [];
  for (var i = 0; i < CITY_DATA.length; i++){
    var r = CITY_DATA[i];
    if (r === centerCity) continue;
    if (onlyCity && r.l !== 'c') continue;
    if (hideOwn && r.l === 'd' && (r.s === core || core.indexOf(r.s) >= 0 || r.s.indexOf(core) >= 0)) continue;
    var d = hav(centerCity.x, centerCity.y, r.x, r.y);
    if (d <= radiusKm) arr.push({ r: r, d: d });

  arr.sort(function(a, b){ return a.d - b.d; });
  return arr;
}

/* 2. 侧栏渲染：标题、统计、地区标签、结果列表 */
function render(){
  results = compute();
  document.getElementById('title').textContent = centerCity.n + ' · ' + radiusKm + ' km 圈内';
  document.getElementById('rval').textContent = radiusKm + ' km';

  var nc = 0, ps = {};
  for (var i = 0; i < results.length; i++){
    if (results[i].r.l === 'c') nc++;
    ps[results[i].r.s] = 1;
  }
  var plist = Object.keys(ps).sort();
  document.getElementById('stats').innerHTML = '共 <b>' + results.length + '</b> 个行政单元 · 地级市 <b>' + nc + '</b> 个 · 跨 <b>' + plist.length + '</b> 个地区';
  document.getElementById('provs').innerHTML = plist.slice(0, 12).map(function(p){ return '<span class="pill">' + esc(p) + '</span>'; }).join('') + (plist.length > 12 ? '<span class="pill">…</span>' : '');

  var html = '';
  for (var j = 0; j < results.length; j++){
    var it = results[j];
    html += '<div class="row" data-i="' + j + '">'
      + '<span class="idx">' + (j + 1) + '</span>'
      + '<span class="nm">' + esc(it.r.n) + '</span>'
      + '<span class="tag ' + it.r.l + '">' + (it.r.l === 'c' ? '地级市' : '区县') + '</span>'
      + '<span class="sub">' + esc(it.r.s) + '</span>'
      + '<span class="dst">' + it.d.toFixed(1) + ' km</span>'
      + '</div>';
  }
  if (!results.length) html = '<div style="padding:24px 15px;color:#9ca3af;font-size:13px">当前条件下没有匹配的行政单元，试试调大半径或切换粒度。</div>';
  document.getElementById('list').innerHTML = html;
  var rows = document.querySelectorAll('#list .row');
  for (var k = 0; k < rows.length; k++){
    rows[k].addEventListener('click', (function(idx){ return function(){ focus(idx); }; })(k));
  }
  drawMap();
}

/* 3A. 离线示意地图：SVG 等距投影画圆、点、比例尺、图例（无 Key、无网络、无行政边界） */

  s.push('<line x1="0" y1="0" x2="' + barPx + '" y2="0" stroke="#475569" stroke-width="3"/>');
  s.push('<line x1="0" y1="-5" x2="0" y2="5" stroke="#475569" stroke-width="2"/>');
  s.push('<line x1="' + barPx + '" y1="-5" x2="' + barPx + '" y2="5" stroke="#475569" stroke-width="2"/>');
  s.push('<text x="0" y="21" font-size="12" fill="#64748b">0</text>');
  s.push('<text x="' + (Number(barPx)-12).toFixed(1) + '" y="21" font-size="12" fill="#64748b">' + barKm + ' km</text>');
  s.push('</g>');
  s.push('<g transform="translate(' + (W-186) + ',18)">');
  s.push('<rect x="0" y="0" width="168" height="78" rx="8" fill="#ffffff" stroke="#e2e8f0"/>');
  s.push('<circle cx="16" cy="22" r="5" fill="#dc2626"/><text x="30" y="26" font-size="12" fill="#475569">中心城市</text>');
  s.push('<circle cx="16" cy="44" r="5" fill="#ea580c"/><text x="30" y="48" font-size="12" fill="#475569">地级市 ' + results.filter(function(x){ return x.r.l === 'c'; }).length + ' 个</text>');
  s.push('<circle cx="16" cy="66" r="4" fill="#2563eb"/><text x="30" y="70" font-size="12" fill="#475569">区县 ' + results.filter(function(x){ return x.r.l === 'd'; }).length + ' 个</text>');
  s.push('</g>');
  s.push('</svg></div></div>');
  var box = document.getElementById('map');
  box.innerHTML = s.join('');
  var pts = box.querySelectorAll('[data-pt]');
  for (var n = 0; n < pts.length; n++){
    pts[n].addEventListener('click', (function(idx){ return function(){ showCard(results[idx], false); }; })(parseInt(pts[n].getAttribute('data-pt'), 10)));
  }
  document.getElementById('card').style.display = 'none';
}

/* 3B. Leaflet 底图：初始化 / 切换底图 / 同步图形 */
function destroyLeaflet(){
  if (map){ try { map.remove(); } catch(e){} map = null; }
  tileLayers = []; circleLayer = null; markerLayer = null; labelLayer = null; mapHost = null;
}

function ensureMap(p){
  var box = document.getElementById('map');
  if (map && mapHost && document.body.contains(mapHost)) return;
  destroyLeaflet();
  box.innerHTML = '';
  mapHost = document.createElement('div');
  mapHost.className = 'map-host';
  box.appendChild(mapHost);
  map = L.map(mapHost, {
    center: toLatLng(centerCity.x, centerCity.y),
    zoom: 9,
    zoomControl: true,
    attributionControl: true,
    preferCanvas: false
  });
  L.control.scale({ imperial: false, position: 'bottomleft', maxWidth: 140 }).addTo(map);
  applyProvider(p);
  needsFit = true;
}

function applyProvider(p){
  if (!map || !p || !p.layers) return;
  for (var i = 0; i < tileLayers.length; i++){ try { map.removeLayer(tileLayers[i]); } catch(e){} }
  tileLayers = [];
  var opts = {
    maxZoom: p.maxZoom || 18,
    minZoom: 3,
    detectRetina: false,
    attribution: p.attribution || ''
  };
  for (var j = 0; j < p.layers.length; j++){
    var cfg = p.layers[j];
    var layer = L.tileLayer(cfg.url, Object.assign({}, opts, {
      subdomains: cfg.subdomains || 'abc',
      opacity: cfg.opacity === undefined ? 1 : cfg.opacity,
      maxNativeZoom: cfg.maxNativeZoom || (p.maxZoom || 18)
    }));
    layer.addTo(map);
    tileLayers.push(layer);
  }
  if (p.maxZoom) map.setMaxZoom(p.maxZoom);
  /* 底图换坐标系后，中心点也要跟着换算 */
  map.setView(toLatLng(centerCity.x, centerCity.y), map.getZoom() || 9, { animate: false });
}

/* 文字标注：用 divIcon 渲染，随缩放自动定位，不拦截鼠标点击 */
function labelIcon(text, extraClass){
  return L.divIcon({
    className: 'map-label-wrap',
    html: '<span class="map-label ' + (extraClass || '') + '">' + text + '</span>',
    iconSize: null,
    iconAnchor: [-6, 9]
  });
}

function dotIcon(kind){
  var size = kind === 'center' ? 22 : (kind === 'city' ? 15 : 9);
  return L.divIcon({
    className: 'mk-wrap',
    html: '<div class="mk mk-' + kind + '"></div>',
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
    popupAnchor: [0, -size/2 - 2]
  });
}

function syncGeometry(){
  var p = currentProvider();
  var c = toLatLng(centerCity.x, centerCity.y);

  if (circleLayer){ map.removeLayer(circleLayer); circleLayer = null; }
  circleLayer = L.circle(c, {
    radius: radiusKm * 1000,
    color: '#2563eb',
    weight: 2,
    opacity: 0.9,
    fillColor: '#2563eb',
    fillOpacity: 0.08,
    interactive: false
  }).addTo(map);

  if (markerLayer){ map.removeLayer(markerLayer); markerLayer = null; }
  if (labelLayer){ map.removeLayer(labelLayer); labelLayer = null; }
  markerLayer = L.layerGroup().addTo(map);
  labelLayer = L.layerGroup().addTo(map);

  /* 中心点 */
  L.marker(c, { icon: dotIcon('center'), zIndexOffset: 1000, title: centerCity.n })
    .addTo(markerLayer)
    .on('click', function(){ showCard({ r: centerCity, d: 0 }, true); });
  L.marker(c, { icon: labelIcon(esc(centerCity.n), 'map-label-center'), interactive: false, keyboard: false })
    .addTo(labelLayer);

  /* 圈内的点 */
  for (var i = 0; i < results.length; i++){
    (function(it){
      var isC = it.r.l === 'c';
      var m = L.marker(toLatLng(it.r.x, it.r.y), {
        icon: dotIcon(isC ? 'city' : 'dist'),
        title: it.r.n + ' · ' + it.d.toFixed(1) + ' km',
        riseOnHover: true
      }).addTo(markerLayer);
      m.on('click', function(ev){
        if (ev && ev.originalEvent) L.DomEvent.stopPropagation(ev);
        showCard(it, false);
      });
      if (isC && results.length <= 160){
        L.marker(toLatLng(it.r.x, it.r.y), { icon: labelIcon(esc(it.r.n)), interactive: false, keyboard: false })
          .addTo(labelLayer);
      }
    })(results[i]);
  }

  /* 视野：换城市 / 换底图 / 圆超出当前视野时自动适应 */
  var cb = circleLayer.getBounds();
  if (needsFit || !map.getBounds().contains(cb)){
    map.fitBounds(cb, { padding: [40, 40], animate: true });
    needsFit = false;
  }
  document.getElementById('card').style.display = 'none';
}

/* 4. 地图总入口：在线底图优先，失败自动降级为离线示意图 */
function drawMap(){
  var p = currentProvider();
  var canOnline = p && !p.offline && typeof L !== 'undefined' && L.map;
  if (!canOnline){ drawOfflineMap(); return; }
  try {
    ensureMap(p);
    syncGeometry();
  } catch (e){
    console.warn('[map] 在线底图渲染失败，已降级为离线示意图：', e);
    drawOfflineMap();
  }
}

/* 5. 详情卡片 */
function showCard(it, isCenter){
  var r = it.r;
  document.getElementById('cardBody').innerHTML = '<h3>' + esc(r.n) + '</h3>'
    + '<p>类型：' + (isCenter ? '中心点' : (r.l === 'c' ? '地级市' : '区 / 县 / 县级市')) + '</p>'
    + '<p>所属：' + esc(r.s) + '</p>'
    + (isCenter ? '' : '<p>直线距离：<b>' + it.d.toFixed(1) + ' km</b></p>')
    + '<p style="font-size:11px;color:#9ca3af">' + r.x.toFixed(4) + ', ' + r.y.toFixed(4) + '</p>';
  document.getElementById('card').style.display = 'block';
}
/* 6. 列表点击定位（离线模式下只弹卡片） */
function focus(i){
  var it = results[i];
  if (!it) return;
  if (map) map.panTo(toLatLng(it.r.x, it.r.y), { animate: true });
  showCard(it, false);
}

/* 7. 中心城市输入联想 */
function initCitySearch(){
  var input = document.getElementById('cityInput'), box = document.getElementById('suggest');
  input.value = centerCity.n;
  function suggest(){
    var q = input.value.trim();
    if (!q){ box.style.display = 'none'; return; }
    var hits = CITY_DATA.filter(function(r){ return r.n.indexOf(q) >= 0; });
    hits.sort(function(a, b){
      var pa = a.n === q ? 0 : (a.n.indexOf(q) === 0 ? 1 : 2), pb = b.n === q ? 0 : (b.n.indexOf(q) === 0 ? 1 : 2);
      if (pa !== pb) return pa - pb;
      if (a.l !== b.l) return a.l === 'c' ? -1 : 1;
      return a.n.length - b.n.length;
    });
    hits = hits.slice(0, 12);
    if (!hits.length){ box.style.display = 'none'; return; }
    box.innerHTML = hits.map(function(r){
      return '<div data-i="' + CITY_DATA.indexOf(r) + '"><span>' + esc(r.n) + '</span><small>' + esc(r.s) + ' · ' + (r.l === 'c' ? '地级市' : '区县') + '</small></div>';
    }).join('');
    box.style.display = 'block';
    var ds = box.querySelectorAll('div');
    for (var k = 0; k < ds.length; k++){
      ds[k].addEventListener('mousedown', (function(idx){ return function(ev){
        ev.preventDefault();
        centerCity = CITY_DATA[idx];
        input.value = centerCity.n;
        box.style.display = 'none';
        needsFit = true;
        render();
      }; })(parseInt(ds[k].getAttribute('data-i'), 10)));
    }
  }
  input.addEventListener('input', suggest);
  input.addEventListener('focus', suggest);
  input.addEventListener('blur', function(){ setTimeout(function(){ box.style.display = 'none'; }, 150); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      var first = box.querySelector('div');
      if (first && box.style.display !== 'none') { first.dispatchEvent(new MouseEvent('mousedown')); }
      else {
        var hit = findCity(input.value);
        if (hit){ centerCity = hit; input.value = hit.n; box.style.display = 'none'; needsFit = true; render(); }
      }
    }
  });
}

/* 8. 导出 CSV（UTF-8 BOM，Excel 可直接打开） */
function exportCsv(){
  var lines = ['名称,类型,所属,直线距离(km),经度,纬度'];
  results.forEach(function(it){
    lines.push([it.r.n, it.r.l === 'c' ? '地级市' : '区县', it.r.s, it.d.toFixed(2), it.r.x, it.r.y].join(','));
  });
  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = centerCity.n + '_' + radiusKm + 'km.csv';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

/* 9. URL 参数：?city=城市名&r=100&lv=city&own=1&map=osm */
function applyUrlParams(){
  var p = new URLSearchParams(location.search);
  if (p.get('city')){
    var hit = findCity(p.get('city'));
    if (hit) centerCity = hit;
  }
  var rr = parseInt(p.get('r'), 10);
  if (rr >= 20 && rr <= 500) radiusKm = rr;
  if (p.get('lv') === 'city') onlyCity = true;
  if (p.get('own') === '1') hideOwn = false;
  if (p.get('map')) providerId = p.get('map');

  document.getElementById('radius').value = radiusKm;
  var qs = document.querySelectorAll('.quick button');
  for (var i = 0; i < qs.length; i++) qs[i].classList.toggle('on', parseInt(qs[i].getAttribute('data-r'), 10) === radiusKm);
  if (onlyCity){ document.getElementById('lvCity').classList.add('on'); document.getElementById('lvAll').classList.remove('on'); }
  document.getElementById('hideOwn').checked = hideOwn;
}

/* 10. 底图下拉框 */
function initProviderSelect(){
  var sel = document.getElementById('provider');
  var list = CFG.providers || {};
  var ids = Object.keys(list).filter(function(id){ return list[id].enabled !== false; });
  if (!ids.length) ids = ['offline'];
  if (ids.indexOf(providerId) < 0) providerId = ids[0];
  sel.innerHTML = ids.map(function(id){
    return '<option value="' + id + '">' + esc(list[id].name || id) + '</option>';
  }).join('');
  sel.value = providerId;
  sel.addEventListener('change', function(){
    providerId = sel.value;
    needsFit = true;
    try { localStorage.setItem('crt.provider', providerId); } catch(e){}
    if (map){ destroyLeaflet(); document.getElementById('map').innerHTML = ''; }
    render();
  });
  try {
    var saved = localStorage.getItem('crt.provider');
    var fromUrl = new URLSearchParams(location.search).get('map');   /* URL 参数优先级最高 */
    if (!fromUrl && saved && ids.indexOf(saved) >= 0 && saved !== providerId){
      providerId = saved; sel.value = saved; needsFit = true;
    }
  } catch(e){}
}

/* 11. 初始化：解析参数、绑定控件、首屏渲染 */
window.addEventListener('load', function(){
  applyUrlParams();
  initProviderSelect();
  initCitySearch();
  var ri = document.getElementById('radius');
  ri.addEventListener('input', function(){
    radiusKm = parseInt(ri.value, 10);
    var qs = document.querySelectorAll('.quick button');
    for (var k = 0; k < qs.length; k++) qs[k].classList.toggle('on', parseInt(qs[k].getAttribute('data-r'), 10) === radiusKm);
    render();
  });
  var qs = document.querySelectorAll('.quick button');
  for (var i = 0; i < qs.length; i++){
    qs[i].addEventListener('click', (function(btn){ return function(){
      radiusKm = parseInt(btn.getAttribute('data-r'), 10);
      ri.value = radiusKm;
      for (var k = 0; k < qs.length; k++) qs[k].classList.remove('on');
      btn.classList.add('on');
      render();
    }; })(qs[i]));
  }
  document.getElementById('lvAll').addEventListener('click', function(){ onlyCity = false; this.classList.add('on'); document.getElementById('lvCity').classList.remove('on'); render(); });
  document.getElementById('lvCity').addEventListener('click', function(){ onlyCity = true; this.classList.add('on'); document.getElementById('lvAll').classList.remove('on'); render(); });
  document.getElementById('hideOwn').addEventListener('change', function(){ hideOwn = this.checked; render(); });
  document.getElementById('export').addEventListener('click', exportCsv);
  document.getElementById('cardClose').addEventListener('click', function(){ document.getElementById('card').style.display = 'none'; });
  render();
});

</script>
